<!DOCTYPE html>
<html lang="ru">
<head>

<title>Карточки — Бензопила GEOS Max CSP346</title>

  <div class="grid">

    <div class="card"><img src="card-003.png" alt="003"><div>Карточка 3</div></div>
    <div class="card"><img src="card-004.png" alt="004"><div>Карточка 4</div></div>

    <div class="card"><img src="card-006.png" alt="006"><div>Карточка 6</div></div>

</html>
